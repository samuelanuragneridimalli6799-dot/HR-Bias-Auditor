name: keep-streamlit-awake
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
jobs:
  wake:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: |
          python - <<'EOF'
          from playwright.sync_api import sync_playwright
          URL = "https://samuel-hr-bias-auditor.streamlit.app/"
          with sync_playwright() as p:
              b = p.chromium.launch()
              page = b.new_page()
              page.goto(URL, timeout=60000)
              page.wait_for_timeout(5000)
              print("Landed on:", page.url)
              btn = page.get_by_role("button", name="Yes, get this app back up!")
              if btn.count() > 0:
                  print("App was asleep - clicking wake button")
                  btn.click()
                  page.wait_for_timeout(60000)
              else:
                  print("No wake button - app already awake (or page differs)")
                  page.wait_for_timeout(15000)
              b.close()
          EOF
